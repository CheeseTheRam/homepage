
<!DOCTYPE html>
<html>
<head><style>
  body { font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
  .box { border: 2px solid #333; border-radius: 8px; padding: 24px; width: 100%; max-width: 700px; }
  .row { display: flex; gap: 20px; margin-bottom: 24px; }
  .field { display: flex; align-items: flex-end; gap: 6px; font-size: 14px; margin-bottom: 15px; }
  .line { flex: 1; border-bottom: 1px solid #000; }
</style></head>
<body>
  <div class="box">
    <div class="row">
      <div style="flex: 3; display: flex; flex-direction: column; gap: 12px;">
        <div class="field">Participant Signature: <span class="line"></span></div>
        <div class="field"><span class="line"></span></div>
      </div>
      <div class="field" style="flex: 1; align-self: flex-start;">Date: <span class="line"></span></div>
    </div>
    <div class="row" style="margin: 0">
      <div style="flex: 3; display: flex; flex-direction: column; gap: 12px;">
        <div class="field">Leader Signature: <span class="line"></span></div>
        <div class="field"><span class="line"></span></div>
      </div>
      <div class="field" style="flex: 1; align-self: flex-start;">Date: <span class="line"></span></div>
    </div>
  </div>
</body>
</html>
